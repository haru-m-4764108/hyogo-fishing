<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>兵庫南部 釣り情報</title>
<meta name="theme-color" content="#0f4c5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="釣り情報">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f4f6f7;--card:#fff;--text:#1b2428;--sub:#5d6b72;--line:#e1e6e9;
  --accent:#0f4c5c;--accent2:#1f8a9e;--chip:#e8f1f3;--warn:#b3261e;--warnbg:#fdecea;
  --high:#d1495b;--low:#2e86ab;--tide:#1f8a9e;--tidefill:rgba(31,138,158,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1416;--card:#172024;--text:#e6eef0;--sub:#9aabb2;--line:#26343a;
  --accent:#7fd1e0;--accent2:#5bbccf;--chip:#1f2e33;--warn:#ffb4ab;--warnbg:#3a1f1d;
  --high:#ff8a9a;--low:#7cc4e8;--tide:#5bbccf;--tidefill:rgba(91,188,207,.18);
}}
:root[data-theme="dark"]{
  --bg:#0e1416;--card:#172024;--text:#e6eef0;--sub:#9aabb2;--line:#26343a;
  --accent:#7fd1e0;--accent2:#5bbccf;--chip:#1f2e33;--warn:#ffb4ab;--warnbg:#3a1f1d;
  --high:#ff8a9a;--low:#7cc4e8;--tide:#5bbccf;--tidefill:rgba(91,188,207,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent2);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] header{background:#123940}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{background:#123940}}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:20px;padding:4px 6px;cursor:pointer}
header .upd{font-size:11px;opacity:.85;text-align:right;line-height:1.3}
main{max-width:760px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:8px 0 6px;color:var(--sub);font-size:11px}
nav.tabs a .i{display:block;font-size:20px;line-height:1.2}
nav.tabs a.on{color:var(--accent2);font-weight:600}
h2{font-size:16px;margin:18px 0 8px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card.link{display:block;color:inherit}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:12.5px}
.title{font-weight:600}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;background:var(--chip);color:var(--text);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.tide{font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.star{background:none;border:0;font-size:22px;cursor:pointer;color:var(--sub);padding:0 2px}
.star.on{color:#e9b100}
.badge{background:var(--accent2);color:#fff;border-radius:999px;font-size:12px;padding:0 8px;font-weight:600}
.badge.zero{background:var(--line);color:var(--sub)}
table.fish{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.fish td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}
table.fish td:first-child{font-weight:600;white-space:nowrap}
table.fish td.n{text-align:right;white-space:nowrap}
.row.sub > span{white-space:nowrap}
.row.sub > span.ellip{white-space:nowrap;min-width:0}
.src{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.tidebox svg{width:100%;height:auto;display:block}
.hl{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;margin-top:4px}
.hl b{font-variant-numeric:tabular-nums}
.hi{color:var(--high)} .lo{color:var(--low)}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.days button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.3;cursor:pointer;min-width:52px}
.days button.on{border-color:var(--accent2);box-shadow:inset 0 0 0 1px var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sns a{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px}
.sns a span.i{font-size:18px;width:22px;text-align:center}
.warnc{background:var(--warnbg);border-color:transparent}
.warnc .title{color:var(--warn)}
.back{display:inline-block;margin:2px 0 6px;font-size:14px}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:13.5px}
.status li{font-size:12.5px;color:var(--sub)}
.ng{color:var(--warn)}
select{font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);width:100%}
</style>
</head>
<body>
<header>
  <h1 id="htitle">兵庫南部 釣り情報</h1>
  <div class="upd" id="upd"></div>
  <button id="themeBtn" aria-label="表示テーマ切替">◐</button>
</header>
<main id="app"><div class="empty">読み込み中…</div></main>
<nav class="tabs">
  <a href="#/" data-tab="spots"><span class="i">📍</span>釣り場</a>
  <a href="#/catches" data-tab="catches"><span class="i">🐟</span>釣果</a>
  <a href="#/tide" data-tab="tide"><span class="i">🌊</span>潮見表</a>
  <a href="#/rigs" data-tab="rigs"><span class="i">🎣</span>仕掛け</a>
  <a href="#/memory" data-tab="memory"><span class="i">📸</span>メモリー</a>
  <a href="#/events" data-tab="events"><span class="i">📅</span>イベント</a>
</nav>
<script src="main.js"></script>
<script src="rigs.js"></script>
<script src="app2.js"></script>
</body>
</html>
